{% extends "dashboard/base.html" %}
{% block content %}
<h2>Users</h2>
<table role="grid">
  <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Phone</th><th>Telegram</th><th>Staff</th></tr></thead>
  <tbody>
    {% for u in page %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.phone|default:"—" }}</td>
        <td>{{ u.telegram_username|default:"—" }}</td>
        <td>{{ u.is_staff }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
